<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>蒲公英降落台 · 下载</title>
<style>
:root{--bg:#f4f7f1;--card:#fff;--text:#1f2937;--muted:#6b7280;--green:#3f7652;--green2:#2f6041;--soft:#edf6ed;--line:#dce7dc;--shadow:0 20px 60px rgba(48,76,53,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100dvh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 15% 10%,#fff 0,#f4f7f1 36%,#e8f0e5 100%);color:var(--text);display:flex;align-items:center;justify-content:center;padding:24px}
.page{width:min(940px,100%)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--green);text-decoration:none;font-size:14px;margin-bottom:14px;padding:8px 4px}
.hero{background:var(--card);border:1px solid rgba(63,118,82,.12);border-radius:28px;box-shadow:var(--shadow);overflow:hidden}
.top{padding:34px 38px 26px;background:linear-gradient(135deg,#f8fcf7,#e9f4e8);display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--line)}
.mark{width:70px;height:70px;border-radius:22px;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:36px;box-shadow:0 12px 28px rgba(63,118,82,.25)}
h1{font-size:30px;letter-spacing:.04em;color:#23442e}.subtitle{margin-top:7px;color:var(--muted);line-height:1.6;font-size:14px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:0}
.choice{padding:34px 38px;min-height:350px}.choice+.choice{border-left:1px solid var(--line)}
.choice h2{font-size:19px;color:#294b34;margin-bottom:8px}.choice p{color:var(--muted);font-size:13px;line-height:1.7;margin-bottom:22px}
.download{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:52px;border-radius:14px;background:var(--green);color:#fff;text-decoration:none;font-size:16px;font-weight:700;box-shadow:0 10px 22px rgba(63,118,82,.2);transition:.2s}
.download:hover{background:var(--green2);transform:translateY(-1px)}
.meta{font-size:12px;color:var(--muted);margin-top:12px;text-align:center}
.qr-wrap{width:218px;height:218px;margin:4px auto 14px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;align-items:center;justify-content:center}
#qrCanvas{max-width:100%;height:auto}.qr-fallback{font-size:12px;color:var(--muted);text-align:center;word-break:break-all;line-height:1.5}
.url{display:flex;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.url code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#365740}
.copy{border:0;background:#fff;color:var(--green);border-radius:8px;padding:7px 10px;cursor:pointer;font-weight:600;white-space:nowrap}
.foot{padding:15px 28px;text-align:center;color:var(--muted);font-size:12px;border-top:1px solid var(--line)}
@media(max-width:680px){body{padding:12px;align-items:flex-start}.page{padding-top:calc(6px + env(safe-area-inset-top));padding-bottom:env(safe-area-inset-bottom)}.hero{border-radius:20px}.top{padding:24px 20px}.mark{width:56px;height:56px;border-radius:17px;font-size:29px}h1{font-size:23px}.choices{grid-template-columns:1fr}.choice{padding:25px 20px;min-height:0}.choice+.choice{border-left:0;border-top:1px solid var(--line)}.download{min-height:54px}.qr-wrap{width:205px;height:205px}}
</style>
</head>
<body>
<main class="page">
  <a class="back" id="backLink" href="/">← 返回局域网共享</a>
  <section class="hero">
    <header class="top">
      <div class="mark">🌱</div>
      <div><h1>蒲公英降落台</h1><div class="subtitle">让连接请求落到安卓设备上。浏览器关闭时也能收到通知，同意后自动打开共享网页。</div></div>
    </header>
    <div class="choices">
      <section class="choice">
        <h2>下载到当前设备</h2>
        <p>点击按钮，将安卓安装包下载到现在打开本页面的设备。</p>
        <a class="download" id="downloadButton" href="#" download="DandelionLanding.apk">⬇ 下载 APK</a>
        <div class="meta">Android 8.0 及以上 · 独立安装 · 无需应用商店</div>
      </section>
      <section class="choice">
        <h2>扫码下载到另一台设备</h2>
        <p>用安卓手机相机扫描二维码，APK 将直接下载到扫码的手机。</p>
        <div class="qr-wrap" id="qrWrap"><canvas id="qrCanvas"></canvas></div>
        <div class="url"><code id="downloadUrl">—</code><button class="copy" id="copyButton">复制</button></div>
      </section>
    </div>
    <footer class="foot">安装后请打开一次“蒲公英降落台”，允许通知，并允许后台运行。</footer>
  </section>
</main>
<script>
(function(){
  var token=new URLSearchParams(location.search).get("t");
  var suffix=token?"?t="+encodeURIComponent(token):"";
  var localDownloadUrl=location.origin+"/api/bridge-apk"+suffix;
  var qrDownloadUrl="",qrLibraryReady=false;
  document.getElementById("downloadButton").href=localDownloadUrl;
  document.getElementById("backLink").href="/"+suffix;
  document.getElementById("copyButton").addEventListener("click",function(){
    if(!qrDownloadUrl)return;
    var button=this;
    function done(){button.textContent="已复制";setTimeout(function(){button.textContent="复制"},1600)}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(qrDownloadUrl).then(done);else{var input=document.createElement("textarea");input.value=qrDownloadUrl;document.body.appendChild(input);input.select();document.execCommand("copy");input.remove();done()}
  });
  function renderQr(){
    if(!qrLibraryReady||!qrDownloadUrl)return;
    try{var qr=qrcode(0,"M");qr.addData(qrDownloadUrl,"Byte");qr.make();var canvas=document.getElementById("qrCanvas"),cell=6,margin=12,size=qr.getModuleCount()*cell+margin*2;canvas.width=size;canvas.height=size;var context=canvas.getContext("2d");context.fillStyle="#fff";context.fillRect(0,0,size,size);context.fillStyle="#183b25";for(var row=0;row<qr.getModuleCount();row++)for(var col=0;col<qr.getModuleCount();col++)if(qr.isDark(row,col))context.fillRect(col*cell+margin,row*cell+margin,cell,cell)}catch(error){document.getElementById("qrWrap").innerHTML='<div class="qr-fallback">二维码生成失败，请复制下方地址到手机浏览器。</div>'}
  }
  function setQrAddress(base){qrDownloadUrl=String(base||location.origin).replace(/\/$/,"")+"/api/bridge-apk"+suffix;document.getElementById("downloadUrl").textContent=qrDownloadUrl;renderQr()}
  var script=document.createElement("script");script.src="/qrcode.min.js"+suffix;script.onload=function(){qrLibraryReady=true;renderQr()};script.onerror=function(){document.getElementById("qrWrap").innerHTML='<div class="qr-fallback">二维码组件加载失败，请复制下方局域网地址。</div>'};document.head.appendChild(script);
  fetch("/api/info"+suffix).then(function(response){if(!response.ok)throw new Error("HTTP "+response.status);return response.json()}).then(function(info){var currentIsLan=location.hostname!=="127.0.0.1"&&location.hostname!=="localhost"&&location.hostname!=="::1";setQrAddress(currentIsLan?location.origin:info.lanUrl)}).catch(function(){setQrAddress(location.origin);document.getElementById("qrWrap").innerHTML='<div class="qr-fallback">无法获取局域网地址，请通过局域网 IP 打开本页后重试。</div>'});
})();
</script>
</body>
</html>
