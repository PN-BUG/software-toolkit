<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>局域网文件共享</title>
<style>
:root {
  --bg: #edf3ee; --surface: rgba(255,255,255,.94); --surface2: #f4f8f5;
  --surface3: #e9f2ec; --text: #173128; --text2: #60746b; --text3: #91a198;
  --border: #dce8e0; --primary: #247a5a; --primary-light: #e0f2e8;
  --primary-hover: #196548; --danger: #d95050; --success: #24a36d;
  --warning: #e49a32; --header-from: #f9fcfa; --header-to: #e8f3ec;
  --scroll-thumb: rgba(54,112,84,.34); --scroll-thumb-hover: rgba(36,122,90,.62); --scroll-track: rgba(36,82,61,.045);
  --shadow: 0 8px 28px rgba(37,75,57,.08),0 1px 2px rgba(37,75,57,.05);
  --shadow-lg: 0 18px 50px rgba(29,69,50,.16);
  --radius: 18px; --radius-sm: 11px;
  --transition: .2s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"] {
  --bg: #0d1713; --surface: rgba(22,37,31,.96); --surface2: #1c3028;
  --surface3: #223b31; --text: #e7f2eb; --text2: #a2b8ad; --text3: #718a7d;
  --border: #30483d; --primary: #5ac495; --primary-light: #183d2d;
  --primary-hover: #73d5a9; --header-from: #172b23; --header-to: #13241d;
  --scroll-thumb: rgba(112,170,141,.38); --scroll-thumb-hover: rgba(90,196,149,.7); --scroll-track: rgba(255,255,255,.035);
  --shadow: 0 10px 30px rgba(0,0,0,.22);
  --shadow-lg: 0 18px 52px rgba(0,0,0,.42);
}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) var(--scroll-track)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:var(--scroll-track);border-radius:999px}
*::-webkit-scrollbar-thumb{min-height:38px;background:var(--scroll-thumb);background-clip:content-box;border:3px solid transparent;border-radius:999px}
*::-webkit-scrollbar-thumb:hover{background:var(--scroll-thumb-hover);background-clip:content-box}
*::-webkit-scrollbar-corner{background:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Microsoft YaHei","PingFang SC",sans-serif;background:radial-gradient(circle at 8% 0,rgba(116,185,143,.22),transparent 29%),radial-gradient(circle at 94% 8%,rgba(244,196,112,.16),transparent 25%),var(--bg);color:var(--text);min-height:100vh;transition:background var(--transition),color var(--transition)}
.app{max-width:1480px;margin:0 auto;padding:20px;display:flex;flex-direction:column;height:100vh}
.header{position:relative;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;padding:18px 22px;background:linear-gradient(135deg,var(--header-from),var(--header-to));border:1px solid rgba(74,122,94,.12);border-radius:22px;box-shadow:var(--shadow);margin-bottom:10px;transition:background var(--transition);overflow:hidden}
.header:after{content:"";position:absolute;right:18%;top:-70px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.27);pointer-events:none}
.header-left{display:flex;align-items:center;gap:14px;position:relative;z-index:1}
.brand-mark{width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#2f916c,#1d6b4e);color:#fff;box-shadow:0 9px 22px rgba(36,122,90,.25);font-size:24px}
.brand-copy{display:flex;flex-direction:column;gap:2px}.eyebrow{font-size:9px;font-weight:800;letter-spacing:.18em;color:var(--primary);text-transform:uppercase;opacity:.76}
.logo{font-size:21px;line-height:1.18;font-weight:760;color:var(--text);display:flex;align-items:center;gap:8px;letter-spacing:.02em}
.brand-subtitle{font-size:11px;color:var(--text2)}
.logo-icon{font-size:26px}
.header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:13px;font-weight:650;transition:all var(--transition);white-space:nowrap}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-hover);transform:translateY(-1px);box-shadow:0 4px 12px rgba(79,70,229,.3)}
.btn-outline{background:rgba(255,255,255,.66);color:var(--text);border:1px solid var(--border);backdrop-filter:blur(8px)}
[data-theme="dark"] .btn-outline{background:rgba(14,28,22,.5)}
.btn-outline:hover{background:var(--surface);border-color:rgba(36,122,90,.35)}
.btn-ghost{background:transparent;color:var(--text2);padding:8px}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-icon{width:40px;height:40px;padding:0;display:inline-flex;align-items:center;justify-content:center;border-radius:12px}
.btn-danger{background:var(--danger);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
.info-bar{display:grid;grid-template-columns:auto minmax(180px,1.2fr) minmax(220px,1fr) auto;align-items:center;gap:8px;padding:8px;background:var(--surface);border:1px solid rgba(74,122,94,.1);border-radius:16px;box-shadow:var(--shadow);margin-bottom:10px;font-size:12px;color:var(--text2);transition:background var(--transition)}
.info-bar .dot{width:8px;height:8px;border-radius:50%;background:var(--success);display:inline-block;margin-right:6px;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.info-item{display:flex;align-items:center;gap:7px;min-width:0;padding:8px 11px;border-radius:10px;background:var(--surface2)}
.info-item.service-state{background:var(--primary-light);color:var(--primary);font-weight:700}
.info-label{color:var(--text3);font-size:10px;font-weight:700;letter-spacing:.05em}.info-item strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.info-item strong{color:var(--text);font-weight:600}
.main-layout{display:flex;gap:10px;flex:1;min-height:0}
.device-sidebar{width:252px;flex-shrink:0;background:var(--surface);border:1px solid rgba(74,122,94,.1);border-radius:var(--radius);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transition:background var(--transition)}
.sidebar-header{padding:15px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(180deg,var(--surface),var(--surface2))}
.sidebar-header h3{font-size:14px;font-weight:600;color:var(--text)}
.sidebar-actions{display:flex;gap:5px}
.device-list{flex:1;overflow-y:auto;padding:10px;scrollbar-gutter:stable}
.device-card{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:13px;cursor:pointer;transition:all var(--transition);margin-bottom:6px;border:1px solid transparent;background:var(--surface2)}
.device-card:hover{background:var(--surface3);transform:translateX(2px)}
.device-card.active{background:var(--primary-light);border-color:rgba(36,122,90,.35);box-shadow:inset 3px 0 0 var(--primary)}
.device-card.offline{opacity:.6}
.device-card .dev-avatar{width:36px;height:36px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex-shrink:0}
.device-card .dev-info{flex:1;min-width:0}
.device-card .dev-name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.device-card .dev-ip{font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.device-card .dev-status{width:8px;height:8px;border-radius:50%;background:var(--success);flex-shrink:0}
.device-card.offline .dev-status{background:var(--text3)}
.connect-btn{width:28px;height:28px;border:none;border-radius:50%;background:var(--primary-light);color:var(--primary);cursor:pointer;flex-shrink:0;font-size:13px}
.connect-btn:hover{background:var(--primary);color:#fff}
.connect-btn.pending{cursor:wait;opacity:.65}
.device-card.self .dev-avatar{background:#dbeafe;color:#2563eb}
.sidebar-footer{padding:10px 12px;border-top:1px solid var(--border)}
.device-name-display{font-size:12px;color:var(--text2);text-align:center;padding:6px;cursor:pointer;border-radius:var(--radius-sm);transition:background var(--transition)}
.device-name-display:hover{background:var(--surface2)}
.device-name-input{width:100%;padding:6px 8px;border:1.5px solid var(--primary);border-radius:var(--radius-sm);font-size:12px;background:var(--surface);color:var(--text);outline:none;text-align:center}
.content-area{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid rgba(74,122,94,.1);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;transition:background var(--transition)}
.tab-bar{display:flex;gap:5px;border-bottom:1px solid var(--border);padding:8px;flex-shrink:0;background:linear-gradient(180deg,var(--surface),var(--surface2))}
.tab-btn{padding:10px 18px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--text2);font-size:13px;font-weight:650;cursor:pointer;transition:all var(--transition);white-space:nowrap}
.tab-btn:hover{color:var(--text);background:var(--surface)}
.tab-btn.active{color:var(--primary);border-color:rgba(36,122,90,.16);background:var(--surface);box-shadow:0 3px 12px rgba(28,89,64,.08)}
.tab-content{flex:1;display:none;flex-direction:column;min-height:0;position:relative}
.tab-content.active{display:flex}
.breadcrumb{display:flex;align-items:center;gap:4px;flex-wrap:wrap;padding:10px 16px;font-size:14px;border-bottom:1px solid var(--border);flex-shrink:0}
.breadcrumb a{color:var(--primary);text-decoration:none;padding:2px 6px;border-radius:4px;transition:background var(--transition)}
.breadcrumb a:hover{background:var(--primary-light)}
.breadcrumb .sep{color:var(--text3);margin:0 2px}
.breadcrumb .current{color:var(--text);font-weight:500}
.toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0}
.search-box{flex:1;min-width:150px;position:relative}
.search-box input{width:100%;padding:8px 12px 8px 36px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--surface2);color:var(--text);transition:all var(--transition);outline:none}
.search-box input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.search-box .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px}
.view-toggle{display:flex;background:var(--surface2);border-radius:var(--radius-sm);padding:3px}
.view-toggle button{padding:6px 10px;border:none;background:transparent;color:var(--text2);border-radius:6px;cursor:pointer;font-size:13px;transition:all var(--transition)}
.view-toggle button.active{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.upload-zone{border:1.5px dashed rgba(36,122,90,.32);border-radius:15px;padding:22px;text-align:center;color:var(--text2);margin:12px 16px;transition:all var(--transition);cursor:pointer;background:linear-gradient(135deg,var(--surface2),var(--primary-light));flex-shrink:0}
.upload-zone:hover,.upload-zone.drag-over{border-color:var(--primary);color:var(--primary);transform:translateY(-1px);box-shadow:0 10px 25px rgba(36,122,90,.09)}
.upload-zone .upload-icon{font-size:32px;margin-bottom:6px}
.upload-zone .upload-text{font-size:14px;font-weight:500}
.upload-zone .upload-hint{font-size:12px;margin-top:4px;color:var(--text3)}
.upload-zone input[type=file]{display:none}
.progress-wrap{display:none;padding:0 16px;flex-shrink:0}
.progress-wrap.active{display:block}
.progress-bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-bottom:4px}
.progress-fill{height:100%;background:var(--primary);width:0;transition:width .3s;border-radius:3px}
.progress-text{font-size:12px;color:var(--text2)}
.file-scroll{flex:1;overflow-y:auto;padding:12px 16px;scrollbar-gutter:stable}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.file-grid.list-view{grid-template-columns:1fr}
.file-card{background:var(--surface2);border-radius:14px;padding:15px;cursor:pointer;transition:all var(--transition);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;position:relative}
.file-card:hover{border-color:rgba(36,122,90,.45);background:var(--surface);transform:translateY(-3px);box-shadow:0 12px 30px rgba(32,91,65,.12)}
.file-card .file-icon{font-size:36px;line-height:1}
.file-card .file-name{font-size:12px;font-weight:500;color:var(--text);word-break:break-all;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.file-card .file-meta{font-size:10px;color:var(--text3)}
.file-card .file-actions{position:absolute;top:6px;right:6px;opacity:0;transition:opacity var(--transition)}
.file-card:hover .file-actions{opacity:1}
.file-card .file-actions button{width:26px;height:26px;padding:0;border:none;border-radius:6px;background:var(--surface);color:var(--text2);cursor:pointer;font-size:12px;transition:all var(--transition)}
.file-card .file-actions button:hover{background:var(--primary);color:#fff}
.list-view .file-card{flex-direction:row;align-items:center;gap:10px;text-align:left;padding:10px 14px}
.list-view .file-card .file-icon{font-size:24px;flex-shrink:0}
.list-view .file-card .file-name{-webkit-line-clamp:1;flex:1;font-size:13px}
.list-view .file-card .file-meta{flex-shrink:0}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .empty-icon{font-size:48px;margin-bottom:10px}
.empty-state .empty-text{font-size:15px;font-weight:500;color:var(--text2)}
.empty-state .empty-hint{font-size:12px;margin-top:4px}
.chat-container{display:flex;flex-direction:column;flex:1;min-height:0}
.chat-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;flex-shrink:0}
.chat-header .chat-target-name{font-size:14px;font-weight:600;color:var(--text)}
.chat-header .chat-target-ip{font-size:12px;color:var(--text3)}
.chat-messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px;scrollbar-gutter:stable}
.chat-msg{max-width:75%;padding:10px 14px;border-radius:16px;font-size:13px;line-height:1.5;word-break:break-word;position:relative}
.chat-msg.self{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:4px}
.chat-msg.other{align-self:flex-start;background:var(--surface2);color:var(--text);border-bottom-left-radius:4px}
.chat-msg .msg-sender{font-size:11px;font-weight:600;margin-bottom:3px;opacity:.8}
.chat-msg.self .msg-sender{color:rgba(255,255,255,.8)}
.chat-msg.other .msg-sender{color:var(--primary)}
.chat-msg .msg-time{font-size:10px;margin-top:4px;opacity:.6;text-align:right}
.chat-msg .msg-footer{display:flex;align-items:center;justify-content:flex-end;gap:7px;margin-top:4px;font-size:10px;opacity:.72}.chat-msg .msg-state.sending{color:rgba(255,255,255,.8)}.chat-msg .msg-state.failed{color:#fecaca;font-weight:700}.chat-msg.other .msg-state{color:var(--text3)}
.chat-msg .msg-file{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(255,255,255,.15);border-radius:8px;cursor:pointer;margin-top:6px}
.chat-msg.other .msg-file{background:rgba(0,0,0,.05)}
.chat-msg .msg-file:hover{opacity:.8}
.chat-msg .msg-file-icon{font-size:20px}
.chat-msg .msg-file-info{font-size:12px}
.chat-msg .msg-file-name{font-weight:500}
.chat-msg .msg-file-size{opacity:.7;font-size:11px}
.chat-empty{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text3);font-size:14px;flex-direction:column;gap:8px}
.chat-empty-icon{font-size:48px}
.chat-input-area{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end;flex-shrink:0}
.chat-input-area textarea{flex:1;padding:10px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:13px;background:var(--surface2);color:var(--text);resize:none;outline:none;max-height:100px;min-height:40px;font-family:inherit;transition:border-color var(--transition)}
.chat-input-area textarea:focus{border-color:var(--primary)}
.chat-input-area .btn{height:40px}
.chat-attachment-panel{padding:10px 16px 11px;border-top:1px solid var(--border);background:linear-gradient(180deg,var(--surface2),var(--surface));flex-shrink:0}
.attachment-panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.attachment-summary{font-size:12px;font-weight:700;color:var(--text)}.attachment-summary span{font-weight:500;color:var(--text3);margin-left:6px}
.attachment-actions{display:flex;align-items:center;gap:6px}.attachment-actions .btn{padding:6px 10px;font-size:11px}
.attachment-list{display:flex;gap:8px;overflow-x:auto;padding:1px 1px 5px;scroll-snap-type:x proximity;scrollbar-color:var(--scroll-thumb) transparent}
.attachment-list::-webkit-scrollbar,.tab-bar::-webkit-scrollbar,.breadcrumb::-webkit-scrollbar{height:7px}
.attachment-list::-webkit-scrollbar-track,.tab-bar::-webkit-scrollbar-track,.breadcrumb::-webkit-scrollbar-track{background:transparent}
.attachment-list::-webkit-scrollbar-thumb,.tab-bar::-webkit-scrollbar-thumb,.breadcrumb::-webkit-scrollbar-thumb{border-width:2px}
.attachment-card{position:relative;display:flex;align-items:center;gap:9px;min-width:210px;max-width:270px;padding:8px 34px 8px 8px;border:1px solid var(--border);border-radius:11px;background:var(--surface);scroll-snap-align:start;box-shadow:0 3px 10px rgba(34,76,56,.05)}
.attachment-preview{width:38px;height:38px;border-radius:9px;background:var(--primary-light);color:var(--primary);display:grid;place-items:center;flex-shrink:0;font-size:19px;overflow:hidden}
.attachment-preview img{width:100%;height:100%;object-fit:cover}.attachment-info{min-width:0}.attachment-name{font-size:11px;font-weight:650;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.attachment-size{font-size:10px;color:var(--text3);margin-top:3px}
.attachment-remove{position:absolute;top:7px;right:7px;width:22px;height:22px;border:0;border-radius:7px;background:var(--surface2);color:var(--text2);cursor:pointer}.attachment-remove:hover{background:#fee2e2;color:var(--danger)}
.chat-drop-overlay{position:absolute;inset:8px;z-index:20;border:2px dashed var(--primary);border-radius:15px;background:color-mix(in srgb,var(--primary-light) 92%,transparent);display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;pointer-events:none;transition:opacity var(--transition),visibility var(--transition)}
.chat-drop-card{text-align:center;color:var(--primary);font-weight:750;font-size:16px}.chat-drop-card span{display:block;font-size:34px;margin-bottom:7px}.chat-drop-card small{display:block;font-size:11px;font-weight:500;color:var(--text2);margin-top:5px}
#tab-chat.drag-over .chat-drop-overlay{opacity:1;visibility:visible}
.transfer-scroll{flex:1;overflow-y:auto;padding:12px 16px;scrollbar-gutter:stable}
.transfer-section-title{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 8px;font-size:12px;font-weight:600;color:var(--text2)}
.transfer-section-title .count{font-weight:500;color:var(--text3)}
.transfer-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface2);border-radius:var(--radius-sm);margin-bottom:8px;border:1px solid transparent}
.transfer-item.active{border-color:rgba(79,70,229,.22)}
.transfer-item .tf-icon{font-size:24px;flex-shrink:0}
.transfer-item .tf-info{flex:1;min-width:0}
.transfer-item .tf-name{font-size:13px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.transfer-item .tf-meta{font-size:11px;color:var(--text3);display:flex;gap:10px;flex-wrap:wrap;margin-top:3px}
.tf-progress{height:5px;background:var(--border);border-radius:999px;overflow:hidden;margin-top:7px}
.tf-progress-fill{height:100%;background:var(--primary);border-radius:999px;transition:width .2s ease}
.tf-progress.indeterminate .tf-progress-fill{width:38%!important;animation:transferSlide 1.25s ease-in-out infinite}
@keyframes transferSlide{0%{transform:translateX(-120%)}100%{transform:translateX(300%)}}
.transfer-item .tf-status{font-size:11px;font-weight:500;padding:3px 8px;border-radius:12px;flex-shrink:0}
.transfer-item .tf-status.done{background:#d1fae5;color:#065f46}
.transfer-item .tf-status.sending{background:#dbeafe;color:#1e40af}
.transfer-item .tf-status.failed{background:#fee2e2;color:#991b1b}
.tab-badge{display:none;min-width:18px;height:18px;padding:0 5px;align-items:center;justify-content:center;border-radius:9px;background:var(--primary);color:#fff;font-size:10px;margin-left:4px}
.tab-badge.active{display:inline-flex}
.toast-container{position:fixed;top:20px;right:20px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius-sm);font-size:14px;color:#fff;box-shadow:var(--shadow-lg);animation:slideIn .3s ease;max-width:360px}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.info{background:var(--primary)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:999;animation:fadeIn .2s}

<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <div class="brand-mark">↗</div>
      <div class="brand-copy"><span class="eyebrow">Private local transfer</span><span class="logo">局域网共享</span><span class="brand-subtitle">文件、消息与设备，在你的局域网内安全流转</span></div>
    </div>
    <div class="header-actions">
      <button class="btn btn-outline bridge-download" id="btnBridge" title="下载蒲公英降落台" style="display:none">🌱 <span class="btn-label">蒲公英降落台</span></button>
      <button class="btn btn-outline btn-icon" id="btnQr" title="手机扫码访问">📱</button>
      <button class="btn btn-outline btn-icon" id="btnTheme" title="切换深色模式">🌙</button>
    </div>
  </div>
  <div class="info-bar">
    <span class="info-item service-state"><span class="dot"></span> 服务运行中</span>
    <span class="info-item"><span class="info-label">共享目录</span> 📁 <strong id="infoDir">—</strong></span>
    <span class="info-item"><span class="info-label">访问地址</span> 🔗 <strong id="infoUrl">—</strong></span>
    <span class="info-item" id="infoMode">—</span>
  </div>
  <div class="main-layout">
    <div class="device-sidebar">
      <div class="sidebar-header"><h3>📡 设备</h3><div class="sidebar-actions"><button class="btn btn-outline btn-sm" id="btnDiscover" title="发现附近设备">↻</button><button class="btn btn-primary btn-sm" id="btnAddDevice" title="手动添加设备">＋</button></div></div>
      <div class="device-list" id="deviceList"></div>
      <div class="sidebar-footer"><div class="device-name-display" id="deviceNameDisplay" title="点击编辑设备名">—</div></div>
    </div>
    <div class="content-area">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="files">📁 文件管理</button>
        <button class="tab-btn" data-tab="chat">💬 聊天</button>
        <button class="tab-btn" data-tab="transfers">📋 传输列表 <span class="tab-badge" id="transferCount">0</span></button>
      </div>
      <div class="tab-content active" id="tab-files">
        <div class="breadcrumb" id="breadcrumb"></div>
        <div class="toolbar">
          <div class="search-box"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="搜索文件..."></div>
          <div class="view-toggle"><button id="viewGrid" class="active" title="网格视图">⊞</button><button id="viewList" title="列表视图">☰</button></div>
          <button class="btn btn-primary btn-sm" id="btnUpload">⬆ 上传</button>
        </div>
        <div class="upload-zone" id="uploadZone">
          <div class="upload-icon">📂</div><div class="upload-text">拖拽文件到这里上传</div>
          <div class="upload-hint">或点击选择文件 · 支持多文件</div>
          <input type="file" id="fileInput" multiple>
        </div>
        <div class="progress-wrap" id="progressWrap"><div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div><div class="progress-text" id="progressText">上传中...</div></div>
        <div class="file-scroll">
          <div class="file-grid" id="fileGrid"></div>
          <div class="empty-state" id="emptyState" style="display:none"><div class="empty-icon">📭</div><div class="empty-text">此目录为空</div><div class="empty-hint">拖拽文件到上方区域开始上传</div></div>
        </div>
      </div>
      <div class="tab-content" id="tab-chat">
        <div class="chat-drop-overlay" id="chatDropOverlay"><div class="chat-drop-card"><span>📎</span>松开发送文件<small>支持一次拖入多个文件</small></div></div>
        <div class="chat-header" id="chatHeader" style="display:none">
          <div class="dev-avatar" id="chatAvatar" style="width:32px;height:32px;font-size:14px">?</div>
          <div><div class="chat-target-name" id="chatTargetName">—</div><div class="chat-target-ip" id="chatTargetIp">—</div></div>
        </div>
        <div class="chat-messages" id="chatMessages" style="display:none"></div>
        <div class="chat-empty" id="chatEmpty"><div class="chat-empty-icon">💬</div><div>选择左侧设备开始聊天</div></div>
        <div class="chat-attachment-panel" id="chatAttachmentPanel" style="display:none">
          <div class="attachment-panel-head"><div class="attachment-summary">待发送附件 <span id="chatAttachmentSummary">0 个文件</span></div><div class="attachment-actions"><button class="btn btn-ghost" id="btnClearChatFiles">清空</button><button class="btn btn-primary" id="btnSendChatFiles">发送附件</button></div></div>
          <div class="attachment-list" id="chatAttachmentList"></div>
        </div>
        <div class="chat-input-area" id="chatInputArea" style="display:none">
          <button class="btn btn-outline btn-icon" id="btnChatFile" title="发送文件">📎</button>
          <input type="file" id="chatFileInput" style="display:none" multiple>
          <textarea id="chatInput" placeholder="输入消息..." rows="1"></textarea>
          <button class="btn btn-primary" id="btnChatSend">发送</button>
        </div>
      </div>
      <div class="tab-content" id="tab-transfers">
        <div class="transfer-scroll" id="transferList"><div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">暂无传输记录</div></div></div>
      </div>
    </div>
  </div>
</div>
<div class="toast-container" id="toastContainer"></div>
<div class="modal-overlay" id="qrModal" style="display:none">
  <div class="modal"><h3>📱 手机扫码访问</h3><div class="qr-wrap"><canvas id="qrCanvas"></canvas></div>
    <div class="qr-url" id="qrUrl"></div>
    <button class="btn btn-primary" id="btnCopyUrl">📋 复制链接</button>
    <button class="btn btn-outline" id="btnCloseQr">关闭</button>
  </div>
</div>
<div class="modal-overlay" id="addDeviceModal" style="display:none">
  <div class="modal"><h3>➕ 手动添加设备</h3>
    <div class="form-group"><label>设备 IP 地址</label><input type="text" id="addDeviceIp" placeholder="例如 192.168.1.100"></div>
    <div class="form-group"><label>端口号</label><input type="text" id="addDevicePort" placeholder="8088" value="8088"></div>
    <div class="form-actions"><button class="btn btn-outline" id="btnCancelAddDevice">取消</button><button class="btn btn-primary" id="btnConfirmAddDevice">添加</button></div>
  </div>
</div>
<div class="modal-overlay" id="connectRequestModal" style="display:none">
  <div class="modal"><h3>🔗 连接请求</h3>
    <div class="connect-request-device"><div class="dev-avatar" id="requestAvatar">?</div><div><div class="request-name" id="requestName">—</div><div class="request-meta" id="requestMeta">希望与你建立连接</div></div></div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:14px">接受后即可互发消息和文件。</div>
    <div class="form-actions"><button class="btn btn-outline" id="btnRejectConnection">拒绝</button><button class="btn btn-primary" id="btnAcceptConnection">接受</button></div>
  </div>
</div>
<script src="qrcode.min.js"></script>
<script>
var state = { path:'', files:[], view:'grid', theme:localStorage.getItem("lan-share-theme")||"light", serverInfo:null, deviceId:"", deviceName:"", clientId:localStorage.getItem("lan-share-clientId")||"", clientName:localStorage.getItem("lan-share-clientName")||"", devices:{}, knownDevices:{}, connectionStates:{}, seenConnectionEvents:{}, currentConnectionRequest:null, chatTarget:null, messages:[], pendingChatFiles:[], chatSending:false, transfers:[], localTransfers:{}, lastMsgTs:"" };
try{state.knownDevices=JSON.parse(localStorage.getItem("lan-share-knownDevices")||"{}")||{}}catch(e){state.knownDevices={}}
function generateId(){return Math.random().toString(36).substr(2,8)}
async function registerClient(){if(!state.clientId||!state.clientName)return;try{await fetch(api("/client/register"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({clientId:state.clientId,clientName:state.clientName})})}catch(e){}}
function promptClientName(){var n=prompt("请输入此设备的名称:",state.clientName||"");if(n&&n.trim()){state.clientName=n.trim();localStorage.setItem("lan-share-clientName",state.clientName);return true}return false}
function api(p){var s=p.indexOf("?")>=0?"&":"?";var t=new URLSearchParams(location.search).get("t");return "/api"+p+(t?s+"t="+encodeURIComponent(t):"")}
async function fetchList(d){var r=await fetch(api("/list?path="+encodeURIComponent(d||"")));if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
async function fetchInfo(){var r=await fetch(api("/info"));if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}
function escHtml(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML}
function escAttr(s){return s.replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/"/g,"&quot;")}
function getInitial(n){if(!n)return "?";return n.charAt(0).toUpperCase()}
function formatSize(b){if(b>=1073741824)return(b/1073741824).toFixed(2)+" GB";if(b>=1048576)return(b/1048576).toFixed(2)+" MB";if(b>=1024)return(b/1024).toFixed(1)+" KB";return b+" B"}
function formatTime(ts){if(!ts)return "—";var d=new Date(ts);var now=new Date();var hm=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");if(d.toDateString()===now.toDateString())return hm;return String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+" "+hm}
function showToast(m,t){var c=document.getElementById("toastContainer");var e=document.createElement("div");e.className="toast "+(t||"info");e.textContent=m;c.appendChild(e);setTimeout(function(){e.remove()},3000)}
var icons={folder:"📁",image:"🖼️",video:"🎬",audio:"🎵",archive:"📦",code:"📝",doc:"📄",pdf:"📕",excel:"📊",ppt:"📽️",font:"🔤",disk:"💿",exec:"⚙️","default":"📄"};
var imgE=["jpg","jpeg","png","gif","svg","webp","bmp","ico"],vidE=["mp4","avi","mkv","mov","wmv","flv","webm"],audE=["mp3","wav","flac","aac","ogg","wma"],arcE=["zip","rar","7z","tar","gz","bz2","xz"],codeE=["js","ts","jsx","tsx","py","java","c","cpp","h","cs","go","rs","rb","php","swift","kt","sql","sh","bat","ps1","yaml","yml","json","xml","html","css","scss","md"],docE=["txt","log","rtf"],excE=["xls","xlsx","csv"],pptE=["ppt","pptx"],fntE=["ttf","otf","woff","woff2"],dskE=["iso","img","vhd","vmdk"],exeE=["exe","msi","dll","so","dylib","app"];
function getIcon(f){if(f.isDir)return icons.folder;var e=(f.name.split(".").pop()||"").toLowerCase();if(imgE.indexOf(e)>=0)return icons.image;if(vidE.indexOf(e)>=0)return icons.video;if(audE.indexOf(e)>=0)return icons.audio;if(arcE.indexOf(e)>=0)return icons.archive;if(e==="pdf")return icons.pdf;if(codeE.indexOf(e)>=0)return icons.code;if(docE.indexOf(e)>=0)return icons.doc;if(excE.indexOf(e)>=0)return icons.excel;if(pptE.indexOf(e)>=0)return icons.ppt;if(fntE.indexOf(e)>=0)return icons.font;if(dskE.indexOf(e)>=0)return icons.disk;if(exeE.indexOf(e)>=0)return icons.exec;return icons["default"]}
// === Devices ===
function saveKnownDevices(){try{localStorage.setItem("lan-share-knownDevices",JSON.stringify(state.knownDevices))}catch(e){}}
function rememberDevice(d,connected){if(!d||!d.id||d.id===state.clientId)return;var old=state.knownDevices[d.id]||{};state.knownDevices[d.id]={id:d.id,name:d.name||old.name||"未命名设备",ip:d.ip||old.ip||"",port:Number(d.port||old.port||0),type:d.type||old.type||"client",lastSeen:d.lastSeen||(new Date).toISOString(),connected:connected===true||old.connected===true};saveKnownDevices()}
async function pollDevices(notify){try{var r=await fetch(api("/devices"));if(!r.ok)throw new Error("HTTP "+r.status);var l=await r.json();state.devices={};l.forEach(function(d){if(d.id===state.clientId)return;d.online=true;state.devices[d.id]=d;rememberDevice(d,false)});Object.keys(state.knownDevices).forEach(function(id){if(id===state.clientId||state.devices[id])return;var d=Object.assign({},state.knownDevices[id]);d.online=state.connectionStates[id]==="connected";state.devices[id]=d});renderDevices();if(notify)showToast("发现 "+l.filter(function(d){return d.id!==state.clientId}).length+" 台在线设备","success")}catch(e){if(notify)showToast("发现设备失败: "+e.message,"error")}}
function renderDevices(){var el=document.getElementById("deviceList");var h="";h+='<div class="device-card self'+(!state.chatTarget?" active":"")+'" data-id="'+state.clientId+'" onclick="selectDevice(\''+state.clientId+'\')"><div class="dev-avatar">'+getInitial(state.clientName)+'</div><div class="dev-info"><div class="dev-name">'+escHtml(state.clientName)+' (本机)</div><div class="dev-ip">'+(state.serverInfo?state.serverInfo.lanUrl.replace(/\/$/,""):"—")+'</div></div><div class="dev-status"></div></div>';var ids=Object.keys(state.devices).filter(function(id){return id!==state.clientId});ids.sort(function(a,b){var ao=state.devices[a].online!==false?0:1,bo=state.devices[b].online!==false?0:1;return ao-bo||(state.devices[a].name||"").localeCompare(state.devices[b].name||"")});ids.forEach(function(id){var d=state.devices[id],online=d.online!==false,act=state.chatTarget&&state.chatTarget.id===id,pending=state.connectionStates[id]==="pending";var typeLabel=d.type==="server"?" 🖥️":(d.type==="bridge"?" 🌱":" 📱"),statusText=online?(d.connected||state.knownDevices[id]&&state.knownDevices[id].connected?"已连接":(d.type==="bridge"?"蒲公英降落台在线":"在线")):"最近连接";h+='<div class="device-card'+(act?" active":"")+(online?"":" offline")+'" data-id="'+id+'" onclick="selectDevice(\''+id+'\')"><div class="dev-avatar">'+getInitial(d.name)+'</div><div class="dev-info"><div class="dev-name">'+escHtml(d.name)+typeLabel+'</div><div class="dev-ip">'+statusText+' · '+escHtml(d.ip||"")+(d.port?":"+d.port:"")+'</div></div><button class="connect-btn'+(pending?" pending":"")+'" title="'+(pending?"等待对方响应":"发起连接请求")+'" onclick="event.stopPropagation();requestConnection(\''+id+'\')">'+(pending?"…":"🔗")+'</button><div class="dev-status"></div></div>'});if(ids.length===0)h+='<div style="text-align:center;padding:20px;color:var(--text3);font-size:12px">未发现其他设备<br>点击 ↻ 扫描附近设备</div>';el.innerHTML=h}
function selectDevice(id){var previousId=state.chatTarget&&state.chatTarget.id;if(id===state.clientId){state.chatTarget=null}else{var d=state.devices[id]||state.knownDevices[id];if(d&&d.online===false){requestConnection(id);return}state.chatTarget=d||null}var nextId=state.chatTarget&&state.chatTarget.id;if(previousId!==nextId)clearPendingChatFiles();renderDevices();renderChat();switchTab("chat")}
